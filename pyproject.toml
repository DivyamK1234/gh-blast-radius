[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-blast-radius"
version = "0.1.0"
description = "Analyze the blast radius of changes to shared GitHub Actions reusable workflows and composite actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Divyam Khorwal" },
]
keywords = [
    "github",
    "github-actions",
    "reusable-workflows",
    "composite-actions",
    "dependency-graph",
    "blast-radius",
    "devex",
    "platform-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "networkx>=3.2,<4.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-httpx>=0.30,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
gh-blast-radius = "gh_blast_radius.cli:app"

[project.urls]
Homepage = "https://github.com/divyamkhorwal/gh-blast-radius"
Documentation = "https://github.com/divyamkhorwal/gh-blast-radius#readme"
Repository = "https://github.com/divyamkhorwal/gh-blast-radius"
Issues = "https://github.com/divyamkhorwal/gh-blast-radius/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_blast_radius"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["gh_blast_radius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access or a GitHub token (deselect with '-m \"not integration\"')",
]
